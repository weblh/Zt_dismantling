# 前端固定目录：/www/wwwroot/HCR/hcr_web
# 访问地址：http://82.157.64.77/zt/
# 构建：cd admin-app && npm run build:zt ，将 dist/* 上传到 hcr_web/
# 粘贴到宝塔站点反向代理 / 伪静态配置（与本文件一致）

# 无尾斜杠时跳到 /zt/
location = /zt {
    return 301 /zt/;
}

location ^~ /zt/api/ {
    proxy_pass http://127.0.0.1:8086/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    client_max_body_size 50m;
}

# JS/CSS：直接读文件，禁止回退成 HTML
location ^~ /zt/assets/ {
    alias /www/wwwroot/HCR/hcr_web/assets/;
    access_log off;
    expires 7d;
}

location ^~ /zt/favicon.svg {
    alias /www/wwwroot/HCR/hcr_web/favicon.svg;
}

location ^~ /zt/icons.svg {
    alias /www/wwwroot/HCR/hcr_web/icons.svg;
}

# 页面与前端路由：统一返回 index.html（不要 try_files）
location ^~ /zt/ {
    root /www/wwwroot/HCR/hcr_web;
    rewrite ^/zt(/.*)?$ /index.html break;
}
