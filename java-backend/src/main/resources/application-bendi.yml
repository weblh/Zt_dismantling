    # 钉钉开放平台「登录与分享」回调地址，需与开放平台配置一致
    redirect-uri: ${DINGTALK_LOGIN_REDIRECT:http://localhost:5173/login}
    frontend-callback: ${DINGTALK_LOGIN_REDIRECT:http://localhost:5173/login}
