  dashboard:
    enabled: true
    exchange-secret: ${HUB_EXCHANGE_SECRET:gongcheng-hub-exchange-2026}
    display-username: admin

dingtalk:
  stream:
    client-id: ${DINGTALK_CLIENT_ID:dinge2crzcy7wrhadluq}
    client-secret: ${DINGTALK_CLIENT_SECRET:8iTpaPtWH0cGFFCOyTYl1KnvtqzuV124swwJL10cCHSeCaNPkgpt_54fYXzsEne8}
    auto-start: true
  corp-id: ${DINGTALK_CORP_ID:${JDY_CORP_ID:dingcb1f88f31ec617c6f5bf40eda33b7ba0}}
