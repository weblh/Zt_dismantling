spring:
  application:
    name: dismantling-platform-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/dismantling_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: zuantanDismantlingPlatformSecretKeyForJWT2024VeryLongSecretKeySecureHS512
  expiration: 86400000

dingtalk:
  stream:
    client-id: ${DINGTALK_CLIENT_ID:dinge2crzcy7wrhadluq}
    client-secret: ${DINGTALK_CLIENT_SECRET:8iTpaPtWH0cGFFCOyTYl1KnvtqzuV124swwJL10cCHSeCaNPkgpt_54fYXzsEne8}
    auto-start: true
  approval:
    scheduled:
      enabled: true
      cron: "0 30 16 * * ?"
      recent-days: 2

server:
  port: 8084

kingdee:
